<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="description" content="방 코드를 공유하고 친구들과 실시간으로 즐기는 모바일 파티 게임입니다.">
<meta name="keywords" content="파티게임, 멀티플레이, 모바일게임">
<meta name="robots" content="index, follow">
<meta property="og:type" content="website">
<meta property="og:title" content="파티 게임">
<meta property="og:description" content="방을 만들고 친구들과 실시간 파티 게임을 시작하세요.">
<meta property="og:image" content="/images/party-game-og.jpg">
<meta property="og:url" content="/">
<link rel="canonical" href="/">
<title>파티 게임</title>
<link rel="stylesheet" href="css/font.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/commonLayout.css">
<link rel="stylesheet" href="css/layout.css">
<style>
* {box-sizing:border-box;}
[hidden] {display:none!important;}
body {min-width:320px; margin:0; background:#f5f2ff;}
button, input {font:inherit;}
.skipNav {position:absolute; left:-9999px; top:0; width:1px; height:1px; overflow:hidden;}
.skipNav:focus {left:0; width:auto; height:auto; overflow:visible; z-index:9999; padding:8px 16px; background:#000; color:#fff;}
.ir {position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;}
.partyLobby {min-height:100dvh; padding-bottom:max(24px, env(safe-area-inset-bottom));}
.partyLobby .cl_subVisual {height:72px; background:linear-gradient(135deg, #7655f5, #b46cff);}
.partyLobby .cl_breadcrumb {width:100%; font-size:12px; color:#666; padding:14px 20px 0;}
.partyLobby .cl_pageTitle {width:100%; font-family:NotoSansB, sans-serif; font-size:26px; color:#222; margin-bottom:20px; padding:0 20px;}
.partyLobby .contentWrap {width:100%; padding:0 20px;}
.partyLobby .fullContentWrap {width:100%;}
.homeButton {position:fixed; right:16px; top:max(14px, env(safe-area-inset-top)); width:auto; min-height:42px; z-index:100; font-size:14px; padding:0 16px; border:1px solid rgba(255,255,255,.45); border-radius:22px; background:rgba(41,24,74,.78); backdrop-filter:blur(8px);}
.lobbyPanel {width:100%; padding:22px 20px; border:1px solid #ddd6f5; border-radius:18px; background:#fff; box-shadow:0 10px 28px rgba(74,47,140,.1);}
.lobbyPanel h2 {font-size:20px; margin:0 0 8px;}
.lobbyIntro {font-size:14px; color:#666; margin:0 0 24px;}
.lobbyForm label {display:block; font-family:NotoSansB, sans-serif; margin-bottom:8px;}
.lobbyForm input {width:100%; height:52px; font-size:16px; color:#222; margin-bottom:12px; padding:0 14px; border:1px solid #c9c3da; border-radius:12px; background:#fff;}
.lobbyForm input:focus {outline:3px solid rgba(118,85,245,.25); border-color:#7655f5;}
button {width:100%; min-height:52px; font-family:NotoSansB, sans-serif; font-size:16px; color:#fff; border:0; border-radius:12px; background:#7655f5; cursor:pointer; touch-action:manipulation;}
button:focus-visible {outline:3px solid #222; outline-offset:2px;}
button:disabled {background:#aaa4b8; cursor:not-allowed;}
.joinDivider {color:#888; text-align:center; margin:22px 0;}
.homeGames {margin-top:28px; padding-top:22px; border-top:1px solid #ddd6f5;}
.homeGames h2 {font-size:17px;}
.homeGameList {display:flex; flex-direction:column; gap:8px; margin:0; padding:0; list-style:none;}
.homeGameList li {display:flex; justify-content:space-between; align-items:center; gap:10px; font-family:NotoSansB, sans-serif;}
.homeGameList button {width:auto; min-height:38px; font-size:12px; padding:0 14px;}
.message {min-height:18px; font-size:13px; color:#b3261e; margin:14px 0 0;}
.roomHeader {margin-bottom:20px;}
.roomHeader p {color:#666; margin:0 0 10px;}
.roomCode {display:block; font-size:30px; color:#7655f5; letter-spacing:5px;}
.playerList {display:flex; flex-direction:column; gap:8px; margin:0 0 20px; padding:0; list-style:none;}
.playerList li {display:flex; justify-content:space-between; align-items:center; min-height:48px; padding:0 14px; border-radius:10px; background:#f6f4fc;}
.playerState {font-size:12px; color:#666;}
.playerState.offline {color:#b3261e;}
.gameStarted {font-family:NotoSansB, sans-serif; font-size:22px; text-align:center; padding:44px 0;}
.gameChoice {display:flex; flex-direction:column; gap:12px;}
.gameChoice button {display:flex; align-items:center; min-height:104px; text-align:left; padding:14px 18px;}
.gameChoice strong {display:block; font-size:18px; margin-bottom:4px;}
.gameChoice span {font-family:NotoSansR, sans-serif; font-size:13px; opacity:.9;}
.gameChoice .gameInfoButton {min-height:40px; justify-content:center; font-size:13px; color:#7655f5; margin-top:-8px; padding:8px; border:1px solid #7655f5; background:#fff;}
.gameThumbnail {display:block; flex:0 0 72px; width:72px; height:72px; object-fit:contain; margin-right:14px; border-radius:14px; background:rgba(255,255,255,.18);}
.gameStage {display:flex; justify-content:center; align-items:center; flex-direction:column; min-height:420px; overflow:hidden; text-align:center; border-radius:16px; background:radial-gradient(circle at 50% 40%, #ffffff 0, #f4ecff 52%, #e4d6ff 100%);}
.gameStage.penalty {background:radial-gradient(circle at 50% 40%, #ff8c8c 0, #d51f35 68%, #840016 100%); animation:penaltyFlash .2s linear 5;}
.gameStage.exploded {background:radial-gradient(circle at 50% 40%, #fff1a6 0, #ff7448 52%, #7b0011 100%); animation:explosionShake .55s ease-out both;}
.penaltyWarning {font-family:NotoSansB, sans-serif; font-size:14px; color:#b3261e; margin:16px 0 0;}
.gameStage.penalty .penaltyWarning, .gameStage.penalty .suspense {color:#fff;}
.mascotScene {position:relative; width:100%; height:300px; overflow:hidden;}
.pig {position:absolute; left:50%; top:50%; width:230px; height:230px; object-fit:contain; filter:drop-shadow(0 18px 14px rgba(98,47,96,.24)); transform:translate(-50%, -50%);}
.pig.peekLeft {animation:peekLeft var(--moveDuration) ease-in-out both;}
.pig.peekRight {animation:peekRight var(--moveDuration) ease-in-out both;}
.pig.pop {animation:pigPop var(--moveDuration) cubic-bezier(.2,1.5,.4,1) both;}
.pig.run {animation:pigRun var(--moveDuration) ease-in both;}
.pig.fakeout {animation:fakeout var(--moveDuration) ease-in-out both;}
.pig.split:first-child {animation:splitLeft var(--moveDuration) ease-in-out both;}
.pig.split:last-child {animation:splitRight var(--moveDuration) ease-in-out both;}
.pig.merge:first-child {animation:mergeLeft var(--moveDuration) ease-in-out both;}
.pig.merge:last-child {animation:mergeRight var(--moveDuration) ease-in-out both;}
.pigFinale {width:290px; height:290px; object-fit:contain; animation:finalePop 1.2s cubic-bezier(.2,1.4,.4,1) both; filter:drop-shadow(0 20px 18px rgba(98,47,96,.24));}
.bomb {width:230px; height:230px; object-fit:contain; animation:shake .16s linear infinite; filter:drop-shadow(0 20px 18px rgba(45,24,15,.28));}
.suspense {font-family:NotoSansB, sans-serif; font-size:30px; color:#7655f5; animation:pulse .7s ease-in-out infinite alternate;}
.gameHint {font-size:16px; color:#666; margin-bottom:18px;}
.resultIcon {font-size:88px; margin-bottom:16px;}
.resultNames {font-family:NotoSansB, sans-serif; font-size:25px; color:#7655f5; margin-bottom:26px;}
.resultActions {display:flex; width:100%; gap:10px;}
.resultActions button {flex:1;}
.resultActions .secondaryButton {color:#7655f5; border:2px solid #7655f5; background:#fff;}
.topUtility {position:fixed; left:16px; top:max(14px, env(safe-area-inset-top)); display:flex; gap:8px; z-index:100;}
.utilityButton {width:42px; min-height:42px; font-size:18px; padding:0; border:1px solid rgba(255,255,255,.45); border-radius:50%; background:rgba(41,24,74,.78); backdrop-filter:blur(8px);}
.abortButton {width:auto; min-height:40px; font-size:13px; margin-top:16px; padding:0 16px; background:#403655;}
.countdownNumber {font-family:NotoSansB, sans-serif; font-size:96px; color:#7655f5; animation:countdownPop .7s ease-out both;}
.passNotice {font-family:NotoSansB, sans-serif; font-size:14px; color:#7655f5; margin-bottom:12px;}
.gameSettings {padding:14px; margin-bottom:16px; border-radius:12px; background:#f6f4fc;}
.gameSettings label {display:block; margin-bottom:10px;}
.gameSettings select {width:100%; height:46px; padding:0 10px; border:1px solid #c9c3da; border-radius:10px; background:#fff;}
.helpDialog {max-width:360px; width:calc(100% - 40px); padding:24px; border:0; border-radius:18px;}
.helpDialog::backdrop {background:rgba(20,12,35,.72);}
.helpDialog h2 {margin-top:0;}
.helpDialog li {margin-bottom:10px;}
.helpDialog p {line-height:1.6; white-space:pre-line;}
.cardHand {display:flex; justify-content:center; flex-wrap:wrap; gap:8px; width:100%; margin-bottom:22px;}
.numberCard {display:flex; justify-content:center; align-items:center; width:76px; height:108px; font-family:NotoSansB, sans-serif; font-size:32px; color:#7655f5; border:3px solid #7655f5; border-radius:12px; background:#fff; box-shadow:0 8px 16px rgba(74,47,140,.16);}
.cardChoices {display:flex; width:100%; gap:10px;}
.cardChoices button {flex:1; font-size:20px;}
.rankingList {width:100%; margin:0 0 22px; padding:0; list-style:none;}
.rankingList li {display:flex; justify-content:space-between; align-items:center; min-height:48px; padding:8px 12px; border-bottom:1px solid #ddd6f5;}
.rankingList li:first-child {font-family:NotoSansB, sans-serif; color:#7655f5; background:#f4f0ff;}
.rankingList .busted {color:#b3261e; text-decoration:line-through;}
@keyframes peekLeft {0%,100% {transform:translate(-135%, -50%) rotate(14deg);} 35%,65% {transform:translate(-78%, -50%) rotate(8deg);}}
@keyframes peekRight {0%,100% {transform:translate(35%, -50%) rotate(-14deg) scaleX(-1);} 35%,65% {transform:translate(-22%, -50%) rotate(-8deg) scaleX(-1);}}
@keyframes pigPop {0% {transform:translate(-50%, -30%) scale(0); opacity:0;} 35% {transform:translate(-50%, -50%) scale(1.15); opacity:1;} 80% {transform:translate(-50%, -50%) scale(1);} 100% {transform:translate(-50%, -70%) scale(0); opacity:0;}}
@keyframes pigRun {0% {transform:translate(-50%, -50%) scale(.2); opacity:0;} 25% {transform:translate(-50%, -50%) scale(1); opacity:1;} 100% {transform:translate(90%, -55%) scale(.75) rotate(12deg); opacity:0;}}
@keyframes fakeout {0% {transform:translate(-50%, -50%) scale(0); opacity:0;} 30%,65% {transform:translate(-50%, -50%) scale(1.18); opacity:1; filter:drop-shadow(0 0 28px #ffd84d);} 100% {transform:translate(100%, -60%) scale(.55) rotate(22deg); opacity:0;}}
@keyframes splitLeft {0% {transform:translate(-50%, -50%) scale(.9);} 100% {transform:translate(-95%, -50%) scale(.72);}}
@keyframes splitRight {0% {transform:translate(-50%, -50%) scale(.9);} 100% {transform:translate(-5%, -50%) scale(.72) scaleX(-1);}}
@keyframes mergeLeft {0% {transform:translate(-95%, -50%) scale(.72);} 100% {transform:translate(-50%, -50%) scale(.9);}}
@keyframes mergeRight {0% {transform:translate(-5%, -50%) scale(.72) scaleX(-1);} 100% {transform:translate(-50%, -50%) scale(.9) scaleX(-1); opacity:0;}}
@keyframes shake {0%,100% {transform:rotate(-4deg);} 50% {transform:rotate(4deg) scale(1.04);}}
@keyframes pulse {from {transform:scale(.94); opacity:.65;} to {transform:scale(1.04); opacity:1;}}
@keyframes finalePop {0% {transform:scale(.3) rotate(-8deg); opacity:0;} 45% {transform:scale(1.12) rotate(4deg); opacity:1;} 100% {transform:scale(1); opacity:1;}}
@keyframes penaltyFlash {0%,100% {filter:brightness(1);} 50% {filter:brightness(1.45);}}
@keyframes countdownPop {0% {transform:scale(.3); opacity:0;} 70% {transform:scale(1.2); opacity:1;} 100% {transform:scale(1); opacity:1;}}
@keyframes explosionShake {0%,100% {transform:translate(0);} 20% {transform:translate(-10px, 6px) rotate(-2deg);} 40% {transform:translate(9px, -7px) rotate(2deg);} 60% {transform:translate(-6px, 4px);} 80% {transform:translate(4px, -3px);}}
@media(prefers-reduced-motion:reduce) {.pig, .pigFinale, .bomb, .suspense {animation:none;}}
</style>
</head>
<body>
<a href="#content" class="skipNav">본문 바로가기</a>
<div class="pageOutWrap partyLobby">
  <div class="cl_subVisual" aria-hidden="true"></div>
  <button id="homeButton" class="homeButton" type="button" aria-label="홈으로 이동">⌂ 홈</button>
  <nav class="topUtility" aria-label="게임 설정">
    <button id="soundButton" class="utilityButton" type="button" aria-label="소리 끄기">🔊</button>
    <button id="helpButton" class="utilityButton" type="button" aria-label="게임 방법 보기">?</button>
  </nav>
  <div class="cl_breadcrumb" role="navigation" aria-label="현재 위치">HOME / 파티 게임</div>
  <div class="cl_pageTitle">파티 게임</div>
  <main id="content" class="contentWrap">
    <h1 class="ir">모바일 파티 게임</h1>
    <section class="lobbyPanel" aria-labelledby="panelTitle">
      <h2 id="panelTitle">게임 참여</h2>
      <p class="lobbyIntro">닉네임과 전달받은 6자리 방 코드를 입력하세요.</p>
      <form id="joinForm" class="lobbyForm">
        <label for="joinNickname">참가자 닉네임</label>
        <input id="joinNickname" name="nickname" maxlength="12" autocomplete="nickname" required>
        <label for="roomCode">방 코드</label>
        <input id="roomCode" name="code" maxlength="6" inputmode="text" autocomplete="off" autocapitalize="characters" required>
        <button type="submit">참여하기</button>
      </form>
      <p class="joinDivider" aria-hidden="true">방장이신가요?</p>
      <button id="openCreateButton" type="button">방 만들기</button>
      <form id="createForm" class="lobbyForm" hidden>
        <label for="createNickname">방장 닉네임</label>
        <input id="createNickname" name="nickname" maxlength="12" autocomplete="nickname" required>
        <button type="submit">게임 선택하기</button>
      </form>
      <p id="message" class="message" role="alert" aria-live="polite"></p>
      <section class="homeGames" aria-labelledby="homeGamesTitle">
        <h2 id="homeGamesTitle">게임 둘러보기</h2>
        <ul class="homeGameList">
          <li>돼지 술래잡기 <button type="button" data-game-info="character">게임 설명</button></li>
          <li>폭탄 돌리기 <button type="button" data-game-info="bomb">게임 설명</button></li>
          <li>100 카드 승부 <button type="button" data-game-info="cards">게임 설명</button></li>
        </ul>
      </section>
    </section>
  </main>
  <div class="fullContentWrap"></div>
</div>
<dialog id="helpDialog" class="helpDialog">
  <h2>게임 방법</h2>
  <ul>
    <li><strong>돼지 술래잡기:</strong> 여러 화면을 오가는 돼지가 마지막 당첨자를 선택합니다.</li>
    <li><strong>폭탄 돌리기:</strong> 폭탄이 보일 때만 넘기세요. 없는 화면을 누르면 1초간 잠깁니다.</li>
  </ul>
  <button id="closeHelpButton" type="button">확인</button>
</dialog>
<dialog id="gameInfoDialog" class="helpDialog">
  <h2 id="gameInfoTitle">게임 설명</h2>
  <p id="gameInfoText"></p>
  <button id="closeGameInfoButton" type="button">확인</button>
</dialog>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const panel = document.querySelector('.lobbyPanel');
const message = document.getElementById('message');
const playerId = localStorage.partyPlayerId ||= crypto.randomUUID();
let session = JSON.parse(localStorage.partySession || 'null');
let room;
let previousRound = 0;
let audioContext;
let tickTimer;
let countdownTimer;
let soundEnabled = localStorage.partySound !== 'off';
const pigAssets = ['pig-mascot.png', 'pig-peek.png', 'pig-run.png', 'pig-fireworks.png', 'pig-beer.png', 'pig-shot.png', 'pig-cheers.png', 'pig-pour.png', 'pig-tipsy.png', 'pig-dizzy.png', 'pig-moonwalk.png', 'pig-slide.png', 'pig-cartwheel.png', 'pig-disco.png', 'pig-selfie.png', 'pig-hide.png', 'pig-parachute.png', 'pig-superhero.png', 'pig-skates.png', 'pig-banana.png', 'pig-dj.png', 'pig-karaoke.png', 'pig-drum.png', 'pig-star.png', 'pig-bow.png', 'pig-sleep.png', 'pig-jump.png', 'pig-spy.png', 'pig-juggle.png', 'pig-bottle.png', 'pig-umbrella.png', 'pig-rocket.png', 'pig-magician.png', 'pig-ghost.png', 'pig-detective.png', 'pig-king.png', 'pig-cowboy.png', 'pig-weights.png', 'pig-yoga.png', 'pig-sneeze.png'];

pigAssets.forEach(file => { const image = new Image(); image.src = `/assets/${file}`; });

function unlockAudio() {
  if (!soundEnabled) return;
  audioContext ||= new AudioContext();
  if (audioContext.state === 'suspended') audioContext.resume();
}

function tick() {
  if (!audioContext || !soundEnabled) return;
  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();
  oscillator.frequency.value = 880;
  gain.gain.setValueAtTime(.12, audioContext.currentTime);
  gain.gain.exponentialRampToValueAtTime(.001, audioContext.currentTime + .07);
  oscillator.connect(gain).connect(audioContext.destination);
  oscillator.start();
  oscillator.stop(audioContext.currentTime + .07);
}

function syncBombSound() {
  const shouldTick = room?.status === 'playing' && room.game?.type === 'bomb' && room.game.holderId === playerId;
  clearInterval(tickTimer);
  tickTimer = null;
  if (shouldTick && audioContext && soundEnabled) {
    const tickLoop = () => {
      tick();
      const elapsed = Date.now() - (room.game.startsAt || Date.now());
      tickTimer = setTimeout(tickLoop, Math.max(240, 650 - Math.floor(elapsed / 80)));
    };
    tickLoop();
  }
}

function explosionSound() {
  if (!audioContext || !soundEnabled) return;
  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();
  oscillator.type = 'sawtooth';
  oscillator.frequency.setValueAtTime(180, audioContext.currentTime);
  oscillator.frequency.exponentialRampToValueAtTime(45, audioContext.currentTime + .45);
  gain.gain.setValueAtTime(.3, audioContext.currentTime);
  gain.gain.exponentialRampToValueAtTime(.001, audioContext.currentTime + .5);
  oscillator.connect(gain).connect(audioContext.destination);
  oscillator.start();
  oscillator.stop(audioContext.currentTime + .5);
}

function send(event, data) {
  return new Promise((resolve, reject) => socket.emit(event, data, result => result.error ? reject(new Error(result.error)) : resolve(result)));
}

function escapeHtml(value) {
  const span = document.createElement('span');
  span.textContent = value;
  return span.innerHTML;
}

function addAbortControl(isHost) {
  if (!isHost) return;
  panel.insertAdjacentHTML('beforeend', '<button id="abortButton" class="abortButton" type="button">게임 종료</button>');
  document.getElementById('abortButton').onclick = async () => {
    if (confirm('게임을 종료하고 대기실로 돌아갈까요?')) await send('game:abort', {});
  };
}

const gameDescriptions = {
  character:['돼지 술래잡기', '돼지가 참가자들의 화면을 무작위로 오갑니다.\n마지막에 돼지가 나타난 1~3명이 당첨됩니다.'],
  bomb:['폭탄 돌리기', '내 화면에 폭탄이 왔을 때 다음 사람에게 넘기세요.\n제한 시간이 끝날 때 폭탄을 가진 사람이 당첨됩니다.'],
  cards:['100 카드 승부', '1~100 카드에서 원하는 만큼 계속 추가로 받을 수 있습니다.\n합계가 100을 넘으면 탈락하고, 남은 전원이 그만 받으면 높은 순서로 순위가 결정됩니다.']
};

function addGameInfoButtons() {
  panel.querySelectorAll('[data-game], [data-change-game]').forEach(button => {
    const type = button.dataset.game || button.dataset.changeGame;
    button.insertAdjacentHTML('afterend', `<button class="gameInfoButton" type="button" data-game-info="${type}">게임 설명</button>`);
  });
  panel.querySelectorAll('[data-game-info]').forEach(button => button.onclick = openGameInfo);
}

function openGameInfo(event) {
  const [title, description] = gameDescriptions[event.currentTarget.dataset.gameInfo];
  document.getElementById('gameInfoTitle').textContent = title;
  document.getElementById('gameInfoText').textContent = description;
  document.getElementById('gameInfoDialog').showModal();
}

function render() {
  clearTimeout(countdownTimer);
  const me = room.players.find(player => player.id === playerId);
  const isHost = room.hostId === playerId;
  if (room.status === 'countdown') {
    const count = Math.max(1, Math.ceil((room.game.startsAt - Date.now()) / 1000));
    panel.innerHTML = `<div class="gameStage"><p class="gameHint">곧 시작합니다</p><strong class="countdownNumber">${count}</strong></div>`;
    addAbortControl(isHost);
    countdownTimer = setTimeout(render, 150);
    return;
  }
  if (room.status === 'choosing') {
    panel.innerHTML = isHost ? `<h2>다른 게임 선택</h2><p class="lobbyIntro">바로 이어서 플레이할 게임을 골라주세요.</p><div class="gameChoice"><button type="button" data-change-game="character"><img class="gameThumbnail" src="/assets/pig-mascot.png" alt=""><span><strong>돼지 술래잡기</strong>도망치는 돼지의 마지막 선택을 기다려요.</span></button><button type="button" data-change-game="bomb"><img class="gameThumbnail" src="/assets/bomb.png" alt=""><span><strong>폭탄 돌리기</strong>설정한 시간 사이 누군가의 화면에서 폭발해요.</span></button><button type="button" data-change-game="cards"><img class="gameThumbnail" src="/assets/pig-king.png" alt=""><span><strong>100 카드 승부</strong>100을 넘지 않고 가장 높은 합계를 노려요.</span></button></div><p id="message" class="message" role="alert"></p>` : '<div class="gameStage"><p class="suspense">방장이 다른 게임을 고르고 있어요.</p></div>';
    if (isHost) addGameInfoButtons();
    panel.querySelectorAll('[data-change-game]').forEach(button => button.onclick = async () => {
      configureGame(null, button.dataset.changeGame, true);
    });
    return;
  }
  if (room.status === 'playing') {
    const active = room.game.activeIds.includes(playerId);
    const holdingBomb = room.game.holderId === playerId;
    const penalized = (me.penaltyUntil || 0) > Date.now();
    if (room.game.type === 'character') {
      if (room.game.phase === 'finale') {
        panel.innerHTML = '<div class="gameStage"><img class="pigFinale" src="/assets/pig-fireworks.png" alt="폭죽을 터뜨리는 돼지"></div>';
      } else {
        const pair = ['split', 'merge'].includes(room.game.move);
        const pose = room.game.posesById[playerId] || room.game.pose;
        panel.innerHTML = `<div class="gameStage"><p class="gameHint">돼지가 누굴 선택할까요?!</p><div class="mascotScene">${active ? `<img class="pig ${room.game.move}" style="--moveDuration:${room.game.duration}ms" src="/assets/${pose}" alt="장난꾸러기 돼지">${pair ? `<img class="pig ${room.game.move}" style="--moveDuration:${room.game.duration}ms" src="/assets/${pose}" alt="">` : ''}` : ''}</div>${active ? (room.game.move === 'fakeout' ? '<p class="gameHint">당첨…인 줄 알았지?!</p>' : '') : '<p class="gameHint">쉿! 다른 화면을 살펴보세요.</p>'}</div>`;
      }
      addAbortControl(isHost);
    } else if (room.game.type === 'bomb') {
      const from = room.players.find(player => player.id === room.game.lastPass?.fromId)?.nickname;
      const to = room.players.find(player => player.id === room.game.lastPass?.toId)?.nickname;
      const passNotice = from && to ? `${escapeHtml(from)} → ${escapeHtml(to)}` : '폭탄이 출발했습니다!';
      const turn = ((room.game.round - 1) % room.players.length) + 1;
      panel.innerHTML = `<div id="bombStage" class="gameStage ${penalized ? 'penalty' : ''}"><p class="passNotice">${passNotice} · ${turn}/${room.players.length}</p><p class="gameHint">${holdingBomb ? '째깍째깍' : '폭탄이 이동 중이에요…'}</p>${holdingBomb ? `<img class="bomb" src="/assets/bomb.png" alt="불붙은 폭탄"><button id="passButton" type="button" ${penalized ? 'disabled' : ''}>${penalized ? '1초간 멈춤!' : '폭탄 넘기기!'}</button>` : '<p class="suspense">두근두근…</p><p class="penaltyWarning">폭탄이 없을 때 누르면 1초간 멈춥니다</p>'}</div>`;
      document.getElementById('passButton')?.addEventListener('click', async event => { event.currentTarget.disabled = true; try { await send('game:pass', {}); } catch (error) { event.currentTarget.disabled = false; } });
      if (!holdingBomb) document.getElementById('bombStage').onclick = () => send('game:mistake', {}).catch(() => {});
      addAbortControl(isHost);
    } else {
      const cards = room.game.myCards.map(card => `<span class="numberCard">${card}</span>`).join('');
      const chosen = room.game.myChoice !== null;
      const total = room.game.myCards.reduce((sum, card) => sum + card, 0);
      const stopped = room.game.myStanding || room.game.myChoice === false;
      const waiting = room.game.waitingNames.length ? `아직 선택 전: ${room.game.waitingNames.map(escapeHtml).join(', ')}` : '모두 선택했습니다.';
      let action = `<h2>한 장 더 받을까요?</h2><p class="gameHint">현재 합계 ${total} · ${room.game.choiceCount}/${room.game.eligibleCount}명 선택</p><div class="cardChoices"><button type="button" data-card-choice="true" ${chosen ? 'disabled' : ''}>O 한 장 더</button><button type="button" data-card-choice="false" ${chosen ? 'disabled' : ''}>X 결과 보기</button></div>${chosen ? '<p class="gameHint">다른 참가자의 선택을 기다리는 중…</p>' : ''}`;
      if (total > 100) action = `<p class="suspense">100 초과 · 탈락!</p><p class="gameHint">${waiting}</p>`;
      else if (stopped) action = `<p class="suspense">${total}점 확정!</p><p class="gameHint">${waiting}</p>`;
      if (room.game.phase === 'reveal') action = '<p class="suspense">모든 선택 완료!</p><p class="gameHint">3초 뒤 전체 순위 공개</p>';
      panel.innerHTML = `<div class="gameStage"><p class="gameHint">내 카드 · 합계 ${total}</p><div class="cardHand">${cards}</div>${action}</div>`;
      panel.querySelectorAll('[data-card-choice]').forEach(button => button.onclick = () => send('cards:choose', {take:button.dataset.cardChoice === 'true'}).catch(() => {}));
      addAbortControl(isHost);
    }
    return;
  }
  if (room.status === 'result') {
    const winners = room.players.filter(player => room.game.winnerIds.includes(player.id));
    const mine = winners.some(player => player.id === playerId);
    if (room.game.type === 'cards') {
      panel.innerHTML = `<div class="gameStage"><h2>전체 순위</h2><ol class="rankingList">${room.game.rankings.map((result, index) => `<li class="${result.busted ? 'busted' : ''}"><span>${index + 1}. ${escapeHtml(result.nickname)} · ${result.cards.join(' + ')}</span><strong>${result.total}${result.busted ? ' 탈락' : '점'}</strong></li>`).join('')}</ol>${isHost ? '<div class="resultActions"><button id="resetButton" type="button">같은 게임 다시 하기</button><button id="changeButton" class="secondaryButton" type="button">다른 게임 하기</button></div>' : '<p class="gameHint">방장이 다음 게임을 준비하고 있어요.</p>'}</div>`;
      document.getElementById('resetButton')?.addEventListener('click', () => send('game:reset', {mode:'same'}));
      document.getElementById('changeButton')?.addEventListener('click', () => send('game:reset', {mode:'choose'}));
      return;
    }
    panel.innerHTML = `<div class="gameStage"><div class="resultIcon" role="img" aria-label="결과">${room.game.type === 'bomb' ? '💥' : '🎉'}</div><h2>${mine ? '바로 당신입니다!' : (room.game.type === 'bomb' ? '폭탄 당첨자' : '최종 당첨자')}</h2><p class="resultNames">${winners.map(player => escapeHtml(player.nickname)).join(', ')}</p>${isHost ? '<div class="resultActions"><button id="resetButton" type="button">같은 게임 다시 하기</button><button id="changeButton" class="secondaryButton" type="button">다른 게임 하기</button></div>' : '<p class="gameHint">방장이 다음 게임을 준비하고 있어요.</p>'}</div>`;
    if (room.game.type === 'bomb') panel.querySelector('.gameStage').classList.add('exploded');
    if (mine) panel.querySelector('h2').textContent = room.game.type === 'bomb' ? '펑 당첨!' : '당첨자!';
    document.getElementById('resetButton')?.addEventListener('click', () => send('game:reset', {mode:'same'}));
    document.getElementById('changeButton')?.addEventListener('click', () => send('game:reset', {mode:'choose'}));
    return;
  }
  const canStart = room.players.length >= 2 && room.players.every(player => player.ready && player.connected);
  panel.innerHTML = `<header class="roomHeader"><h2>게임 대기실</h2><p>친구에게 아래 코드를 알려주세요.</p><strong class="roomCode">${room.code}</strong></header><ul class="playerList" aria-label="참가자 목록">${room.players.map(player => `<li><span>${escapeHtml(player.nickname)}${player.id === room.hostId ? ' · 방장' : ''}</span><span class="playerState ${player.connected ? '' : 'offline'}">${player.connected ? (player.ready ? '준비 완료' : '준비 중') : '연결 끊김'}</span></li>`).join('')}</ul>${isHost ? `<button id="actionButton" type="button" ${canStart ? '' : 'disabled'}>게임 시작</button>` : `<button id="actionButton" type="button">${me.ready ? '준비 취소' : '준비 완료'}</button>`}<p id="message" class="message" role="alert" aria-live="polite"></p>`;
  document.getElementById('actionButton').onclick = async () => {
    try { await send(isHost ? 'room:start' : 'room:ready', isHost ? {} : {ready:!me.ready}); }
    catch (error) { document.getElementById('message').textContent = error.message; }
  };
}

async function enter(event, type) {
  event.preventDefault();
  message.textContent = '';
  const data = Object.fromEntries(new FormData(event.currentTarget));
  if (blockedNickname(data.nickname)) {
    message.textContent = '해당 닉네임은 사용할 수 없습니다. 다른 닉네임을 골라주세요.';
    return;
  }
  try {
    const result = await send(`room:${type}`, {...data, playerId});
    room = result.room;
    session = {code:room.code};
    localStorage.partySession = JSON.stringify(session);
    render();
  } catch (error) { message.textContent = error.message; }
}

function chooseGame(nickname) {
  panel.innerHTML = `<h2>게임 선택</h2><p class="lobbyIntro">만들 방에서 플레이할 게임을 선택하세요.</p><div class="gameChoice"><button type="button" data-game="character" data-title="돼지 술래잡기"><img class="gameThumbnail" src="/assets/pig-mascot.png" alt=""><span><strong>돼지 술래잡기</strong>화면 사이로 도망치는 돼지가 마지막 당첨자를 선택해요.</span></button><button type="button" data-game="bomb" data-title="폭탄 돌리기"><img class="gameThumbnail" src="/assets/bomb.png" alt=""><span><strong>폭탄 돌리기</strong>폭탄을 넘기다가 시간이 끝난 사람이 당첨돼요.</span></button><button type="button" data-game="cards" data-title="100 카드 승부"><img class="gameThumbnail" src="/assets/pig-king.png" alt=""><span><strong>100 카드 승부</strong>한 장 더 받을지 선택하고 100에 가장 가까이 가세요.</span></button></div><p id="message" class="message" role="alert" aria-live="polite"></p>`;
  addGameInfoButtons();
  panel.querySelectorAll('[data-game]').forEach(button => button.onclick = async () => {
    configureGame(nickname, button.dataset.game, false);
  });
}

function configureGame(nickname, type, replay) {
  const title = gameDescriptions[type][0];
  let settings = '<p>추가 설정 없이 바로 시작합니다.</p>';
  if (type === 'character') settings = '<label for="winnerCount">당첨자 수</label><select id="winnerCount" name="winnerCount"><option value="random">1~3명 무작위</option><option value="1">1명</option><option value="2">2명</option><option value="3">3명</option></select>';
  if (type === 'bomb') settings = '<label for="bombDuration">폭발 시간</label><select id="bombDuration" name="duration"><option value="15-30">15~30초</option><option value="30-60">30~60초</option></select><label><input name="stackPenalty" type="checkbox"> 오터치할 때마다 패널티 누적</label>';
  panel.innerHTML = `<h2>${title} 설정</h2><form id="settingsForm"><div class="gameSettings">${settings}</div><button type="submit">${replay ? '이 게임 시작하기' : '이 설정으로 방 만들기'}</button></form><p id="message" class="message" role="alert"></p>`;
  document.getElementById('settingsForm').onsubmit = async event => {
    event.preventDefault();
    if (!confirm(`${title}을(를) 시작할까요?`)) return;
    const values = Object.fromEntries(new FormData(event.currentTarget));
    values.stackPenalty = new FormData(event.currentTarget).has('stackPenalty');
    try {
      const result = await send(replay ? 'game:change' : 'room:create', replay ? {type, settings:values} : {nickname, playerId, gameType:type, settings:values});
      if (!replay) {
        room = result.room;
        session = {code:room.code};
        localStorage.partySession = JSON.stringify(session);
        render();
      }
    } catch (error) { document.getElementById('message').textContent = error.message; }
  };
}

function blockedNickname(value) {
  return value.normalize('NFKC').replace(/[^\p{L}]/gu, '').includes('무철');
}

document.getElementById('openCreateButton').onclick = event => {
  event.currentTarget.hidden = true;
  document.getElementById('createForm').hidden = false;
  document.getElementById('createNickname').focus();
};
document.getElementById('createForm').onsubmit = event => {
  event.preventDefault();
  const nickname = new FormData(event.currentTarget).get('nickname');
  if (blockedNickname(nickname)) {
    message.textContent = '해당 닉네임은 사용할 수 없습니다. 다른 닉네임을 골라주세요.';
    return;
  }
  chooseGame(nickname);
};
document.getElementById('joinForm').onsubmit = event => enter(event, 'join');
document.getElementById('roomCode').oninput = event => event.target.value = event.target.value.toUpperCase().replace(/[^A-Z2-9]/g, '');
document.getElementById('homeButton').onclick = () => {
  if (session && !confirm('현재 방에서 나가 홈으로 이동할까요?')) return;
  clearInterval(tickTimer);
  localStorage.removeItem('partySession');
  socket.disconnect();
  location.href = '/';
};
const soundButton = document.getElementById('soundButton');
function renderSoundButton() {
  soundButton.textContent = soundEnabled ? '🔊' : '🔇';
  soundButton.setAttribute('aria-label', soundEnabled ? '소리 끄기' : '소리 켜기');
}
renderSoundButton();
soundButton.onclick = () => {
  soundEnabled = !soundEnabled;
  localStorage.partySound = soundEnabled ? 'on' : 'off';
  if (soundEnabled) unlockAudio();
  syncBombSound();
  renderSoundButton();
};
const helpDialog = document.getElementById('helpDialog');
document.getElementById('helpButton').onclick = () => helpDialog.showModal();
document.getElementById('closeHelpButton').onclick = () => helpDialog.close();
document.getElementById('closeGameInfoButton').onclick = () => document.getElementById('gameInfoDialog').close();
panel.querySelectorAll('[data-game-info]').forEach(button => button.onclick = openGameInfo);
document.addEventListener('pointerdown', unlockAudio, {once:true});
socket.on('room:updated', updatedRoom => {
  if (room?.status === 'playing' && updatedRoom.status === 'result' && updatedRoom.game?.type === 'bomb') {
    explosionSound();
    navigator.vibrate?.([180, 60, 240]);
  }
  if (updatedRoom.game?.round !== previousRound && (updatedRoom.game?.holderId === playerId || updatedRoom.game?.activeIds.includes(playerId))) navigator.vibrate?.([80, 40, 120]);
  previousRound = updatedRoom.game?.round || 0;
  room = updatedRoom;
  render();
  syncBombSound();
});
socket.on('connect', async () => {
  if (!session?.code) return;
  try { room = (await send('room:resume', {...session, playerId})).room; render(); }
  catch { localStorage.removeItem('partySession'); session = null; }
});
</script>
</body>
</html>
